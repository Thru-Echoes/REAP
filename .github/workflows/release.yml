name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish to PyPI via OIDC
    runs-on: ubuntu-latest
    # The "pypi" environment must be created in the GitHub repo settings and
    # the project must be registered as a Trusted Publisher in PyPI's UI
    # before this workflow can succeed. No API token is committed.
    environment:
      name: pypi
      url: https://pypi.org/p/reap-topics
    permissions:
      id-token: write  # required for OIDC trusted-publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
