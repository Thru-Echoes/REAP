name: golden-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: golden-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Tier 1+2+3 pre-registered invariants
    runs-on: ubuntu-latest
    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + CI extras (no tensorflow; see pyproject [ci])
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Run golden-validation tiers
        run: pytest tests/test_golden_validation.py -v --tb=short
