name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Wheel install smoke test (clean venv)
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet dist/*.whl
          /tmp/wheel-smoke/bin/python -c "import reap; import reap.metrics_catalog; print(reap.__doc__.splitlines()[0])"

      - name: Assert py.typed ships in the wheel
        run: |
          python -c "
          import glob, zipfile
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          assert 'reap/py.typed' in names, f'py.typed missing from {whl}'
          print('py.typed present in', whl)
          "

      - name: Assert sdist carries no research artifacts
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '/(manuscript|results)/'; then
            echo "::error::sdist contains manuscript/ or results/ entries"
            exit 1
          fi
          echo "sdist clean of manuscript/ and results/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
