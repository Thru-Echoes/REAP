[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reap-topics"
version = "0.1.0"
description = "REAP: Reproducible Embedding via Averaged Projection — consensus-based topic modeling with stable dimensionality reduction and neural projection for out-of-sample data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Oliver Muellerklein", email = "omuellerklein@berkeley.edu" },
]
keywords = [
    "umap",
    "dimensionality-reduction",
    "consensus",
    "topic-modeling",
    "embeddings",
    "reproducibility",
    "nlp",
]
classifiers = [
    # PyPI rejects any upload that carries this classifier — from this repo's CI,
    # a local `twine upload`, or anyone. REAP is NOT yet a publishable package, so
    # this is the source-agnostic backstop against accidental publication. Remove it
    # ONLY in the deliberate PR that makes REAP publishable (and that restores the
    # publish job in .github/workflows/release.yml).
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "umap-learn>=0.5",
    "pydantic>=2.0",
]

[project.optional-dependencies]
projection = ["torch>=2.0"]
labeling = ["openai>=1.0", "anthropic>=0.20"]
baselines = ["bertopic>=0.16", "hdbscan>=0.8"]
parametric-umap = ["tensorflow>=2.13"]
text-fixtures = ["sentence-transformers>=2.0"]
coherence = ["gensim>=4.0"]
all = ["reap-topics[projection,labeling,baselines,parametric-umap,text-fixtures,coherence]"]
dev = [
    "reap-topics[all]",
    "pytest>=7.0",
    "pytest-cov",
    "pyright",
    "ruff",
]
# CI test environment: everything in `dev` EXCEPT parametric-umap (tensorflow).
# torch (projection) and tensorflow cannot coexist in one process on the CI
# x86 runners — `transformers` (via sentence-transformers) auto-imports both
# when both are installed, which segfaults. The torch-bearing CI jobs use
# `[ci]` (no tf); a separate isolated job installs `[parametric-umap]` (tf,
# no torch) to keep parametric-umap baseline coverage. See test.yml.
ci = [
    "reap-topics[projection,labeling,baselines,text-fixtures,coherence]",
    "pytest>=7.0",
    "pytest-cov",
    "pyright",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Thru-Echoes/reap-topics"
Documentation = "https://github.com/Thru-Echoes/reap-topics#readme"
Repository = "https://github.com/Thru-Echoes/reap-topics"
Issues = "https://github.com/Thru-Echoes/reap-topics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = "-v --tb=short -ra"
markers = [
    "llm: requires ANTHROPIC_API_KEY and/or OPENAI_API_KEY; makes real API calls",
    "slow: long-running tests (full topic-exclusion sweep, 5-fold × 500-epoch projection head, 30-seed benchmarks)",
    "reference_platform: asserts a pre-registered metric range (evaluation_protocol.md §13) calibrated on the Linux reference environment (golden-validation job); skipped on platforms where ML-stack float behavior diverges (e.g. macOS)",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src/reap", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
